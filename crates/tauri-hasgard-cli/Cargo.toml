[package]
name = "tauri-hasgard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI and MCP server for Tauri Hasgard automation"
keywords = ["tauri", "cli", "testing", "automation", "accessibility"]
categories = ["command-line-utilities", "development-tools::testing"]
readme = "README.md"

[[bin]]
name = "tauri-hasgard"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "macros", "io-util", "time"] }
tracing.workspace = true
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tauri-hasgard-mcp = { version = "0.7.1", path = "../tauri-hasgard-mcp" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
assert_cmd = "2"
serial_test = "4"
tempfile = "3"
