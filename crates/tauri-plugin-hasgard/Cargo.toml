[package]
name = "tauri-plugin-hasgard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native automation and testing bridge for Tauri 3 Wry and CEF applications"
keywords = ["tauri", "plugin", "testing", "automation", "accessibility"]
categories = ["development-tools::testing", "gui"]
readme = "README.md"
links = "tauri-plugin-hasgard"
# Bridge unit tests run from the repository; crate users only need the bridge itself.
exclude = ["js/*.test.mjs"]

[lints]
workspace = true

[features]
cef = ["dep:tauri-runtime-cef"]
mcp = ["dep:tauri-hasgard-mcp"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tracing.workspace = true
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "3.0.0-alpha.6", features = ["unstable"] }
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-runtime-cef = { version = "3.0.0-alpha.7", features = ["unstable"], optional = true }
base64 = "0.23"
enigo = "0.6"
arboard = { version = "3", default-features = false }
tauri-hasgard-mcp = { version = "0.8.0", path = "../tauri-hasgard-mcp", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os="linux")'.dependencies]
enigo = { version = "0.6", features = ["wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEvent", "CGEventTypes", "CGRemoteOperation", "CGEventSource"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSMenu", "NSView", "NSTextInputContext", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSString", "NSObject"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "WKContentWorld", "WKFrameInfo", "WKPreferences", "WKWebViewConfiguration", "block2"] }
core-foundation = "0.10"
core-graphics = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
serial_test = "4"
tokio = { workspace = true, features = ["test-util", "macros"] }

[build-dependencies]
tauri-plugin = { version = "3.0.0-alpha.4", features = ["build"] }
