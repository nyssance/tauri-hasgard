[fmt]
printWidth = 120
semi = false
trailingComma = "none"
sortImports = true
ignorePatterns = [
  "bun.lock",
  "**/dist/**",
  "target/**",
  "benchmarks/macos/results/**",
  "crates/tauri-plugin-hasgard/permissions/autogenerated/**",
  "crates/tauri-plugin-hasgard/permissions/schemas/**",
  "examples/fixture-app/src-tauri/gen/**",
  # Preserve the upstream bundle verbatim; hand-written bridge code is formatted.
  "crates/tauri-plugin-hasgard/js/vendor/**",
  "**/*.toml",
]

[lint]
typeAware = true
ignorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "target/**",
  "examples/fixture-app/src-tauri/gen/**",
  # Only the unmodified third-party bundle is excluded.
  "crates/tauri-plugin-hasgard/js/vendor/**",
]

[run]
bun = true

[lint.rules]
# Lifecycle teardown must fail the test if killing a process or reading its PID fails.
"no-unsafe-finally" = "off"
