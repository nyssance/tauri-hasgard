name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  native-e2e:
    uses: ./.github/workflows/native-e2e.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-release-version.mjs "${GITHUB_REF_NAME}"
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: cargo test --workspace --all-features

  cli:
    needs: [native-e2e, validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p tauri-hasgard-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="tauri-hasgard-${version}-${{ matrix.target }}.tar.gz"
          package="tauri-hasgard-${version}-${{ matrix.target }}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/tauri-hasgard" "$package/"
          cp LICENSE NOTICE.md "$package/"
          tar -czf "$archive" "$package"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = "tauri-hasgard-$version-${{ matrix.target }}.zip"
          $package = "tauri-hasgard-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package
          Copy-Item "target/${{ matrix.target }}/release/tauri-hasgard.exe" $package
          Copy-Item LICENSE,NOTICE.md $package
          Compress-Archive -Path $package -DestinationPath $archive
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: tauri-hasgard-*.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tauri-hasgard-* > SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: dist/tauri-hasgard-*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tauri-hasgard-*
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist

  crates:
    needs: [native-e2e, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      - name: Publish plugin
        run: cargo publish --locked -p tauri-plugin-hasgard
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Publish CLI
        run: cargo publish --locked -p tauri-hasgard-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  npm:
    needs: [native-e2e, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cp ../../LICENSE ../../NOTICE.md .
        working-directory: packages/playwright
      - run: npm publish --access public
        working-directory: packages/playwright

  package-managers:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - run: bun scripts/render-distribution-manifests.mjs "${GITHUB_REF_NAME}" dist generated
      - uses: actions/create-github-app-token@v3
        id: distribution-token
        with:
          client-id: ${{ vars.DISTRIBUTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: nyssance
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write
      - uses: actions/checkout@v6
        with:
          repository: nyssance/homebrew-tap
          token: ${{ steps.distribution-token.outputs.token }}
          path: homebrew-tap
      - uses: actions/checkout@v6
        with:
          repository: nyssance/scoop-bucket
          token: ${{ steps.distribution-token.outputs.token }}
          path: scoop-bucket
      - name: Update Homebrew Tap
        run: |
          mkdir -p homebrew-tap/Formula
          cp generated/tauri-hasgard.rb homebrew-tap/Formula/tauri-hasgard.rb
          git -C homebrew-tap config user.name github-actions[bot]
          git -C homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C homebrew-tap add Formula/tauri-hasgard.rb
          git -C homebrew-tap commit -m "tauri-hasgard ${GITHUB_REF_NAME#v}"
          git -C homebrew-tap push
      - name: Update Scoop Bucket
        run: |
          mkdir -p scoop-bucket/bucket
          cp generated/tauri-hasgard.json scoop-bucket/bucket/tauri-hasgard.json
          git -C scoop-bucket config user.name github-actions[bot]
          git -C scoop-bucket config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C scoop-bucket add bucket/tauri-hasgard.json
          git -C scoop-bucket commit -m "tauri-hasgard ${GITHUB_REF_NAME#v}"
          git -C scoop-bucket push
