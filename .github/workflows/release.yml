name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string
      skip_native_e2e:
        description: Skip native macOS, Windows, and CEF E2E for dependency-only changes
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run protocol:check
      - run: bun scripts/sync-release-version.mjs "${GITHUB_REF_NAME#v}"
      - run: bun scripts/check-release-version.mjs "${GITHUB_REF_NAME}"
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      # Keep CEF outside target/: rust-cache restores that tree without the CEF files.
      - run: bun scripts/test-rust.mjs
        env:
          CEF_PATH: ${{ runner.temp }}/cef-cache

  windows-rust:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-rust
      - run: bun install --frozen-lockfile
      # Keep CEF outside target/: rust-cache restores that tree without the CEF files.
      - run: bun scripts/test-rust.mjs
        env:
          CEF_PATH: ${{ runner.temp }}/cef-cache

  cli:
    needs: [validate, windows-rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p tauri-hasgard-cli --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="tauri-hasgard-${version}-${{ matrix.target }}.tar.gz"
          package="tauri-hasgard-${version}-${{ matrix.target }}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/tauri-hasgard" "$package/"
          cp LICENSE NOTICE.md "$package/"
          tar -czf "$archive" "$package"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = "tauri-hasgard-$version-${{ matrix.target }}.zip"
          $package = "tauri-hasgard-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package
          Copy-Item "target/${{ matrix.target }}/release/tauri-hasgard.exe" $package
          Copy-Item LICENSE,NOTICE.md $package
          Compress-Archive -Path $package -DestinationPath $archive
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: tauri-hasgard-*.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tauri-hasgard-* > SHA256SUMS
      - uses: actions/attest@v4
        with:
          subject-path: dist/tauri-hasgard-*
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: docs/release-${{ github.ref_name }}.md
          files: |
            dist/tauri-hasgard-*
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist

  crates:
    needs: [validate, windows-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check published crates
        id: published
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl --fail --silent --show-error --user-agent tauri-hasgard-release "https://crates.io/api/v1/crates/tauri-hasgard-mcp/$version" >/dev/null && mcp=true || mcp=false
          curl --fail --silent --show-error --user-agent tauri-hasgard-release "https://crates.io/api/v1/crates/tauri-plugin-hasgard/$version" >/dev/null && plugin=true || plugin=false
          curl --fail --silent --show-error --user-agent tauri-hasgard-release "https://crates.io/api/v1/crates/tauri-hasgard-cli/$version" >/dev/null && cli=true || cli=false
          echo "mcp=$mcp" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
        if: steps.published.outputs.mcp != 'true' || steps.published.outputs.plugin != 'true' || steps.published.outputs.cli != 'true'
      # The plugin's `mcp` feature and the CLI both depend on this crate.
      - name: Publish MCP server
        if: steps.published.outputs.mcp != 'true'
        run: cargo publish --locked -p tauri-hasgard-mcp
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Publish plugin
        if: steps.published.outputs.plugin != 'true'
        run: cargo publish --locked -p tauri-plugin-hasgard
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Publish CLI
        if: steps.published.outputs.cli != 'true'
        run: cargo publish --locked -p tauri-hasgard-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  npm:
    needs: [native-e2e, validate, windows-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cp ../../LICENSE ../../NOTICE.md .
        working-directory: packages/playwright
      - name: Check published npm package
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm view "@nyssance/tauri-hasgard@$version" version >/dev/null 2>&1 && published=true || published=false
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - if: steps.published.outputs.published != 'true'
        run: npm publish --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        working-directory: packages/playwright

  npm-cli:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - run: bun scripts/build-cli-npm.mjs "${GITHUB_REF_NAME}" dist npm-cli > packages.txt
      - name: Publish CLI packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          while read -r directory; do
            name=$(node -p "require('./npm-cli/$directory/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "npm-cli/$directory" && npm publish --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }})
          done < packages.txt

  mcp-registry:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: npm-cli
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      # The registry looks the version up on npm, where a new release takes a moment to appear.
      - name: Publish to the MCP Registry
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish; then exit 0; fi
            echo "attempt $attempt failed; retrying in 30 seconds"
            sleep 30
          done
          exit 1

  package-managers:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - run: bun scripts/render-distribution-manifests.mjs "${GITHUB_REF_NAME}" dist generated
      - uses: actions/create-github-app-token@v3
        id: distribution-token
        with:
          client-id: ${{ vars.DISTRIBUTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: nyssance
          repositories: |
            homebrew-tap
            scoop-bucket
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          repository: nyssance/homebrew-tap
          token: ${{ steps.distribution-token.outputs.token }}
          path: homebrew-tap
      - uses: actions/checkout@v7
        with:
          repository: nyssance/scoop-bucket
          token: ${{ steps.distribution-token.outputs.token }}
          path: scoop-bucket
      - name: Update Homebrew Tap
        run: |
          mkdir -p homebrew-tap/Formula
          cp generated/tauri-hasgard.rb homebrew-tap/Formula/tauri-hasgard.rb
          git -C homebrew-tap config user.name github-actions[bot]
          git -C homebrew-tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C homebrew-tap add Formula/tauri-hasgard.rb
          git -C homebrew-tap commit -m "tauri-hasgard ${GITHUB_REF_NAME#v}"
          git -C homebrew-tap push
      - name: Update Scoop Bucket
        run: |
          mkdir -p scoop-bucket/bucket
          cp generated/tauri-hasgard.json scoop-bucket/bucket/tauri-hasgard.json
          git -C scoop-bucket config user.name github-actions[bot]
          git -C scoop-bucket config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C scoop-bucket add bucket/tauri-hasgard.json
          git -C scoop-bucket commit -m "tauri-hasgard ${GITHUB_REF_NAME#v}"
          git -C scoop-bucket push
