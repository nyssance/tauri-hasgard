[package]
name = "tauri-hasgard-fixture-app"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "tauri_hasgard_fixture_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[features]
hasgard-testing = ["dep:tauri-plugin-global-shortcut", "dep:rmcp", "dep:serde_json", "dep:tokio", "tauri-plugin-hasgard/mcp"]

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = [] }
tauri-runtime-wry = "3.0.0-alpha.6"
tauri-plugin-hasgard = { path = "../../../crates/tauri-plugin-hasgard" }
# The in-process MCP check drives the plugin's server with an rmcp client over an in-memory pipe.
rmcp = { version = "3", default-features = false, features = ["client", "server", "transport-async-rw"], optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = { version = "3.0.0-alpha.3", optional = true }
